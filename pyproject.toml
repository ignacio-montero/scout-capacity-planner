[project]
name = "scout-capacity-planner"
version = "0.1.0"
description = "Scenario simulator for staffing and work assignment at a fictional football scouting agency."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaleido>=1.4.0",
    "numpy>=2.5.3",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "statsmodels>=0.15.0",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
# Stretch goal only (AI request intake). Nothing in the core pipeline imports it.
intake = [
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the import name (scout_planner) differs from the project name.
packages = ["src/scout_planner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Docs are hand-written; their code samples are aligned for reading, not formatted.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting (isort)
    "B",   # bugbear: likely bugs (mutable defaults, etc.)
    "UP",  # pyupgrade: modern syntax for the target Python
    "SIM", # simplifications
]

[tool.ruff.lint.isort]
known-first-party = ["scout_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app/ on the import path so Streamlit view scripts (app/views/*.py) can `import ui`
# when opened directly by AppTest; the real app does this in app/main.py.
pythonpath = ["app"]
# -ra: summarise skips/xfails at the end, so a skipped guardrail check is visible.
# --strict-markers: a mistyped marker is an error, not a silently new marker.
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running test (deselect with -m 'not slow')",
]
