# M3 calibration at a 0.3 s solver limit (speed check), paired in one sweep so
# both run on the same code and the same worlds. Scenarios: flat demand, 2x and 4x growth, with and
# without following the hiring plan (2x without hiring = the tight case).
name: optimiser_eval_fast
base: config/default.yaml
vary:
  demand.actual_growth: [1.0, 2.0, 4.0]
  team.follow_hiring_plan: [true, false]
  assignment.policy: [edf, optimiser]
fixed:
  sim.seeds: 3
  assignment.time_limit_s: 0.3
