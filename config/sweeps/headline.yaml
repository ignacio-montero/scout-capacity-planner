# The README answer: demand grows 4x this year and the agency plans for it
# (assumed growth = actual). Which combination of assignment policy, hiring
# mix (the plan's full-time/freelance rule, freelancers only, full-timers
# only), planning caution (P50 / P80 / P90 forecast) and the pre-screen tool
# keeps >= 95% of reports within 14 days at the lowest total cost?
# 3 x 3 x 3 x 2 = 54 runs x 3 seeds. Each run is one dot on the
# on-time vs cost chart; the cheapest dot above the 95% line is the answer.
name: headline
base: config/default.yaml
vary:
  assignment.policy: [fcfs, edf, optimiser]
  capacity_plan.hire_mix: [rule, freelance_only, full_time_only]
  capacity_plan.quantile: [0.5, 0.8, 0.9]
  automation.enabled: [false, true]
fixed:
  demand.actual_growth: 4.0
  sim.seeds: 3
  assignment.time_limit_s: 0.3
link:
  capacity_plan.assumed_growth: demand.actual_growth
