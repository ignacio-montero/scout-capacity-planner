# Only the primary colour is set ("pitch green"; DESIGN_SYSTEM.md section 2.1).
# Streamlit's default red would read as "danger", and red is reserved for "late".
# No `base`: the app follows the user's light/dark setting.
[theme]
primaryColor = "#237A4B"

# Local tool: listen on this machine only, never on the LAN or public Wi-Fi.
[server]
address = "localhost"

# Hide the developer toolbar items (including "Deploy"): this app is not deployed.
[client]
toolbarMode = "minimal"
